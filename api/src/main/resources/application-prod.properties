# ============================================================================
# Perfil de PRODUCAO. Ativado quando a variavel SPRING_PROFILES_ACTIVE=prod.
# Regra de ouro do deploy: nada que muda entre a sua maquina e o servidor
# fica no codigo. Tudo vem de VARIAVEIS DE AMBIENTE.
# ============================================================================

# A porta vem do servidor (o Render injeta a variavel PORT). Local cai em 8082.
server.port=${PORT:8080}

# Banco Postgres: a URL, o usuario e a senha vem do ambiente (nada no codigo).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O Hibernate cria/atualiza as tabelas sozinho a partir das suas @Entity.
spring.jpa.hibernate.ddl-auto=update

# Nada de console do H2 em producao.
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
