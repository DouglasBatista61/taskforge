# ============================================================================
# Perfil de PRODUCAO. Ativado quando a variavel SPRING_PROFILES_ACTIVE=prod.
# Regra de ouro do deploy: nada que muda entre a sua maquina e o servidor
# fica no codigo. Tudo vem de VARIAVEIS DE AMBIENTE.
# ============================================================================

# A porta vem do servidor (o Render injeta a variavel PORT). Local cai em 8082.
server.port=${PORT:8080}

# Banco Postgres: a URL, o usuario e a senha vem do ambiente (nada no codigo).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# AGORA O FLYWAY MANDA NO BANCO.
# O Hibernate so CONFERE se as tabelas batem com as @Entity (validate),
# nao cria nem altera nada. Quem evolui o banco e o Flyway, pelos V<n>.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# O banco de producao ja existe (criado no deploy da 10.1 com ddl-auto=update).
# baseline-on-migrate diz pro Flyway: "considere o que ja esta como a versao 1"
# e rode so da versao 2 em diante. Num banco vazio, ele roda o V1 tambem.
spring.flyway.baseline-on-migrate=true

#-------------- Desafio 10.1 -------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.h2.console.enabled=false